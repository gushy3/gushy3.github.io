name: Audit de Performance Lighthouse
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v4

      - name: Installer et démarrer le serveur de test
        run: |
          npm install -g serve
          serve -p 8080 . &
          sleep 3 # Attend 3 secondes que le serveur s'allume

      - name: Lancer l'audit Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/index.html
          uploadArtifacts: true
          temporaryPublicStorage: true
